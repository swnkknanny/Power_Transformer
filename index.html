<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAM Analysis Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-bolt-lightning logo-icon"></i>
      <span>Substation RAM Analysis Dashboard</span>
    </div>
  </header>

  <div class="layout-container">
    
    <!-- Sidebar อัปโหลดและเลือก Sheet -->
    <aside class="sidebar">
      <h3><i class="fa-solid fa-file-excel"></i> ข้อมูลไฟล์ Excel</h3>
      <div class="drop-zone">
        <i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
        <p class="drop-text">คลิกเพื่อเลือกไฟล์ ALL_RAM</p>
        <input type="file" id="excelFile" accept=".xlsx, .xls" />
      </div>

      <div id="fileControls" style="display: none; margin-top: 20px;">
        <label for="sheetSelect"><strong>เลือกระบบ (Subsystem):</strong></label>
        <select id="sheetSelect" class="form-select"></select>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- KPI Cards -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div>
            <span class="metric-title">Avg. Availability</span>
            <h2 id="avgAvail" style="color: #16a34a;">-%</h2>
          </div>
          <i class="fa-solid fa-chart-line metric-icon green"></i>
        </div>

        <div class="metric-card">
          <div>
            <span class="metric-title">Avg. MTBF (ชม.)</span>
            <h2 id="avgMtbf" style="color: #2563eb;">-</h2>
          </div>
          <i class="fa-solid fa-clock-rotate-left metric-icon blue"></i>
        </div>

        <div class="metric-card">
          <div>
            <span class="metric-title">Avg. MTTR (ชม.)</span>
            <h2 id="avgMttr" style="color: #ea580c;">-</h2>
          </div>
          <i class="fa-solid fa-screwdriver-wrench metric-icon orange"></i>
        </div>

        <div class="metric-card">
          <div>
            <span class="metric-title">Total Failure Modes</span>
            <h2 id="totalModes">-</h2>
          </div>
          <i class="fa-solid fa-triangle-exclamation metric-icon purple"></i>
        </div>
      </div>

      <!-- ส่วนตาราง -->
      <div class="table-card">
        <div class="table-header">
          <h3 id="currentSheetTitle">ตารางการวิเคราะห์ RAM</h3>
          <input type="text" id="searchInput" placeholder="🔍 ค้นหา Component, Code, Cause..." class="search-input" />
        </div>
        
        <div class="table-wrapper" id="tableContainer">
          <div class="empty-state">
            <i class="fa-regular fa-folder-open"></i>
            <p>กรุณาเลือกไฟล์ ALL_RAM.xlsx เพื่อเริ่มวิเคราะห์ข้อมูล</p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>

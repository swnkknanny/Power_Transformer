<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Maintenance & Failure Dashboard</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #1e293b;
            --secondary-color: #0f172a;
            --accent-color: #3b82f6;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --tag-t-bg: #e0f2fe;
            --tag-t-color: #0369a1;
            --tag-l-bg: #fef3c7;
            --tag-l-color: #b45309;
            --tag-h-bg: #f1f5f9;
            --tag-h-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--secondary-color);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header i {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
            flex: 1;
            overflow-y: auto;
        }

        .menu-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 8px 24px;
            font-weight: 600;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-left-color: var(--accent-color);
        }

        .sidebar-menu li a i {
            width: 20px;
            font-size: 1.1rem;
        }

        .badge-count {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: auto;
        }

        /* Main Content */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .content-container {
            padding: 32px;
            flex: 1;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-info h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-info p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Table Card & Filter */
        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-header-tools {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 420px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .filter-group {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Table */
        .table-responsive {
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
            padding: 14px 24px;
            border-bottom: 2px solid var(--border-color);
            z-index: 1;
        }

        tbody td {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 8px;
            letter-spacing: 0.5px;
        }

        .tag-t { background-color: var(--tag-t-bg); color: var(--tag-t-color); }
        .tag-l { background-color: var(--tag-l-bg); color: var(--tag-l-color); }
        .tag-h { background-color: var(--tag-h-bg); color: var(--tag-h-color); }

        .desc-text {
            color: var(--text-main);
            font-weight: 500;
        }

        .failure-text {
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->

        </div>
        <ul class="sidebar-menu">
            <div class="menu-category">หมวดหมู่ความเสียหาย</div>
            <li>

            <li>

            <li>

                </a>
            </li>
            <li>
                <a href="javascript:void(0)" id="menuOilLeak" onclick="switchTab('OIL LEAK')">
                    <i class="fa-solid fa-droplet"></i>
                    <span>OIL LEAK</span>
                    <span class="badge-count" id="countOilLeakBadge">17</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <header class="top-nav">
            <h1 id="pageTitle"><i class="fa-solid fa-triangle-exclamation" style="margin-right: 10px; color: var(--accent-color);"></i>DAMAGED</h1>
        </header>

        <main class="content-container">
            <!-- KPI Summary Cards -->
            <div class="stats-grid">

                    <div class="stat-icon" style="background-color: #eff6ff; color: #2563eb;">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <div class="stat-info">
                        <h3>รายการในหมวดนี้</h3>
                        <p id="totalRecords">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #ecfeff; color: #0891b2;">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div class="stat-info">
                        <h3>อุปกรณ์หมวด T (Transformer/Relay)</h3>
                        <p id="totalT">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #fffbeb; color: #d97706;">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div class="stat-info">
                        <h3>อุปกรณ์หมวด L</h3>

                </div>
                <div class="stat-card">

                        <i class="fa-solid fa-wrench"></i>
                    </div>
                    <div class="stat-info">
                        <h3>หมวด H / อื่นๆ</h3>
                        <p id="totalH">0</p>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="table-card">
                <div class="table-header-tools">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="ค้นหา Failure Code หรือ Description...">
                    </div>
                    <div class="filter-group">
                        <button class="filter-btn active" onclick="filterData('ALL')">ทั้งหมด</button>
                        <button class="filter-btn" onclick="filterData('T')">หมวด T</button>
                        <button class="filter-btn" onclick="filterData('L')">หมวด L</button>
                        <button class="filter-btn" onclick="filterData('H')">หมวด H</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px; text-align: center;">ลำดับ</th>
                                <th style="width: 50%;">Failure Code</th>
                                <th style="width: 40%;">Description</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data rows will be generated via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

        // 4. ข้อมูล OIL LEAK (17 รายการ)
        const oilLeakData = [

            { code: "แตกหัก / น้ำมันรั่วซึมที่ BUSHING หม้อแปลง", desc: "T007 น้ำมันรั่วซึมที่ Bushing หม้อแปลง" },

            { code: "ความร้อนสูงเกินไป / น้ำมันรั่วซึมที่ CABLE BOX", desc: "T008 น้ำมันรั่วซึมที่ Cable box" },
            { code: "ซีลเสื่อมสภาพ / น้ำมันรั่วซึมที่ RADIATOR", desc: "T009 น้ำมันรั่วซึมที่ Radiator" },
            { code: "ติดตั้งไม่ตามมาตรฐาน / น้ำมันรั่วซึมที่ RADIATOR", desc: "T009 น้ำมันรั่วซึมที่ Radiator" },
            { code: "แรงดันภายในสูง / น้ำมันรั่วซึมที่ RADIATOR", desc: "T009 น้ำมันรั่วซึมที่ Radiator" },

            { code: "ระบบระบายความร้อนทำงานผิดปกติ / น้ำมันหม้อแปลงต่ำ", desc: "T012 น้ำมันหม้อแปลงต่ำ" },
            { code: "ซีลเสื่อมสภาพ / น้ำมันหม้อแปลงต่ำ", desc: "T012 น้ำมันหม้อแปลงต่ำ" },
            { code: "ซีลเสื่อมสภาพ / น้ำมันรั่วซึมที่ฝาบ่อ OLTC", desc: "T210 น้ำมันรั่วซึมที่ฝาบ่อ OLTC" },
            { code: "OLTC ระดับน้ำมันต่ำ ซีลเสื่อมสภาพ", desc: "T212 ระดับน้ำมันต่ำที่ OLTC" },
            { code: "ซีลเสื่อมสภาพ / OIL FILTER UNIT มีน้ำมันรั่วซึม", desc: "T303 Oil filter unit มีน้ำมันรั่วซึม" }
        ];

        let currentTab = 'DAMAGED';
        let currentFilter = 'ALL';
        let searchQuery = '';

        function extractDeviceCode(desc) {
            const match = desc.match(/^([TLH]\d+)/);
            return match ? match[1] : '';
        }

        function getCurrentDataSet() {
            if (currentTab === 'DAMAGED') return damagedData;
            if (currentTab === 'EQUIPMENT ERROR') return equipmentErrorData;
            if (currentTab === 'EXHAUSTION') return exhaustionData;
            if (currentTab === 'OIL LEAK') return oilLeakData;
            return [];
        }

        function switchTab(tabName) {
            currentTab = tabName;
            currentFilter = 'ALL';
            searchQuery = '';
            document.getElementById('searchInput').value = '';

            // Update UI Menu Active State
            document.getElementById('menuDamaged').classList.toggle('active', tabName === 'DAMAGED');
            document.getElementById('menuError').classList.toggle('active', tabName === 'EQUIPMENT ERROR');
            document.getElementById('menuExhaustion').classList.toggle('active', tabName === 'EXHAUSTION');
            document.getElementById('menuOilLeak').classList.toggle('active', tabName === 'OIL LEAK');
            
            // Update Title & Icon
            let icon = 'fa-triangle-exclamation';
            if (tabName === 'EQUIPMENT ERROR') icon = 'fa-circle-exclamation';
            if (tabName === 'EXHAUSTION') icon = 'fa-wind';
            if (tabName === 'OIL LEAK') icon = 'fa-droplet';

            document.getElementById('pageTitle').innerHTML = `<i class="fa-solid ${icon}" style="margin-right: 10px; color: var(--accent-color);"></i>${tabName}`;

            // Reset Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes('ทั้งหมด'));
            });

            updateStats();
            renderTable();
        }

        function updateStats() {
            const data = getCurrentDataSet();
            let countT = 0, countL = 0, countH = 0;

            data.forEach(item => {
                const code = extractDeviceCode(item.desc);
                const prefix = code ? code.charAt(0) : '';
                if (prefix === 'T') countT++;
                else if (prefix === 'L') countL++;
                else if (prefix === 'H') countH++;
            });

            document.getElementById('totalRecords').innerText = data.length;
            document.getElementById('totalT').innerText = countT;
            document.getElementById('totalL').innerText = countL;
            document.getElementById('totalH').innerText = countH;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const data = getCurrentDataSet();

            const filtered = data.filter(item => {
                const devCode = extractDeviceCode(item.desc);
                const prefix = devCode ? devCode.charAt(0) : '';
                
                const matchesCategory = (currentFilter === 'ALL') || 
                                      (currentFilter === 'T' && prefix === 'T') ||
                                      (currentFilter === 'L' && prefix === 'L') ||
                                      (currentFilter === 'H' && (prefix === 'H' || prefix === ''));

                const matchesSearch = item.code.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.desc.toLowerCase().includes(searchQuery.toLowerCase());

                return matchesCategory && matchesSearch;
            });

            filtered.forEach((item, index) => {
                const devCode = extractDeviceCode(item.desc);
                const descText = devCode ? item.desc.replace(devCode, '').trim() : item.desc;
                const prefix = devCode ? devCode.charAt(0) : '';

                let tagHtml = '';
                if (devCode) {
                    let tagClass = 'tag-h';
                    if (prefix === 'T') tagClass = 'tag-t';
                    else if (prefix === 'L') tagClass = 'tag-l';
                    tagHtml = `<span class="tag ${tagClass}">${devCode}</span>`;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">${index + 1}</td>
                    <td class="failure-text">${item.code}</td>
                    <td>
                        ${tagHtml}
                        <span class="desc-text">${descText}</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterData(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(category === 'ALL' ? 'ทั้งหมด' : category)) {
                    btn.classList.add('active');
                }
            });
            renderTable();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTable();
        });

        // Initialize App
        document.getElementById('countDamagedBadge').innerText = damagedData.length;
        document.getElementById('countErrorBadge').innerText = equipmentErrorData.length;
        document.getElementById('countExhaustionBadge').innerText = exhaustionData.length;
        document.getElementById('countOilLeakBadge').innerText = oilLeakData.length;
        updateStats();
        renderTable();
    </script>

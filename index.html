<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Maintenance Dashboard</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS Library for reading Excel files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --sidebar-width: 270px;
            --primary-color: #1e293b;
            --secondary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --tag-t-bg: #e0f2fe;
            --tag-t-color: #0369a1;
            --tag-l-bg: #fef3c7;
            --tag-l-color: #b45309;
            --tag-h-bg: #f1f5f9;
            --tag-h-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--secondary-color);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header i {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .sidebar-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 0;
            flex: 1;
            overflow-y: auto;
        }

        .menu-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 8px 24px;
            font-weight: 600;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-left-color: var(--accent-color);
        }

        .sidebar-menu li a i {
            width: 18px;
            font-size: 1rem;
        }

        .badge-count {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: auto;
        }

        /* Main Wrapper */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .top-nav h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-upload {
            background-color: #10b981;
            color: white;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-upload:hover {
            background-color: #059669;
        }

        .btn-upload input {
            display: none;
        }

        .content-container {
            padding: 32px;
            flex: 1;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-info h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-info p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Table Card & Tools */
        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-header-tools {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 420px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .filter-group {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Table */
        .table-responsive {
            max-height: 560px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
            padding: 14px 24px;
            border-bottom: 2px solid var(--border-color);
            z-index: 1;
        }

        tbody td {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 8px;
            letter-spacing: 0.5px;
        }

        .tag-t { background-color: var(--tag-t-bg); color: var(--tag-t-color); }
        .tag-l { background-color: var(--tag-l-bg); color: var(--tag-l-color); }
        .tag-h { background-color: var(--tag-h-bg); color: var(--tag-h-color); }

        .desc-text {
            color: var(--text-main);
            font-weight: 500;
        }

        .failure-text {
            color: #475569;
        }

        /* Empty / Alert Message */
        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-file-excel"></i>
            <h2>ระบบบำรุงรักษา</h2>
        </div>
        <ul class="sidebar-menu" id="sidebarMenu">
            <div class="menu-category">Sheet ข้อมูล</div>
            <!-- Category list auto-generated from Excel Sheets -->
        </ul>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <header class="top-nav">
            <h1 id="pageTitle"><i class="fa-solid fa-list-check" style="margin-right: 10px; color: var(--accent-color);"></i>รอเลือกเมนู</h1>
            <div class="upload-wrapper">
                <label class="btn-upload">
                    <i class="fa-solid fa-cloud-arrow-up"></i> นำเข้าไฟล์ Excel (.xlsx)
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv">
                </label>
            </div>
        </header>

        <main class="content-container">
            <!-- KPI Summary Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #eff6ff; color: #2563eb;">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <div class="stat-info">
                        <h3>รายการใน Sheet นี้</h3>
                        <p id="totalRecords">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #ecfeff; color: #0891b2;">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div class="stat-info">
                        <h3>รหัสอุปกรณ์ T (Transformer)</h3>
                        <p id="totalT">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #fffbeb; color: #d97706;">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div class="stat-info">
                        <h3>รหัสอุปกรณ์ L</h3>
                        <p id="totalL">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #f1f5f9; color: #475569;">
                        <i class="fa-solid fa-wrench"></i>
                    </div>
                    <div class="stat-info">
                        <h3>รหัสอุปกรณ์ H / อื่นๆ</h3>
                        <p id="totalH">0</p>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="table-card">
                <div class="table-header-tools">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="ค้นหา Failure Code หรือ Description...">
                    </div>
                    <div class="filter-group">
                        <button class="filter-btn active" onclick="filterData('ALL')">ทั้งหมด</button>
                        <button class="filter-btn" onclick="filterData('T')">หมวด T</button>
                        <button class="filter-btn" onclick="filterData('L')">หมวด L</button>
                        <button class="filter-btn" onclick="filterData('H')">หมวด H</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px; text-align: center;">ลำดับ</th>
                                <th style="width: 50%;">Failure Code</th>
                                <th style="width: 40%;">Description</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="3" class="empty-state">
                                    <i class="fa-solid fa-file-excel" style="font-size: 2.5rem; margin-bottom: 12px; color: #cbd5e1;"></i>
                                    <p>ยังไม่มีข้อมูล กรุณากดปุ่ม <strong>"นำเข้าไฟล์ Excel"</strong> ด้านบนขวา</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Handling Excel Import & Parsing -->
    <script>
        let workbookData = {};
        let activeSheet = '';
        let currentFilter = 'ALL';
        let searchQuery = '';

        // ดึง Device Code เช่น T001, L106, H204
        function extractDeviceCode(desc) {
            if (!desc) return '';
            const match = String(desc).match(/^([TLH]\d+)/);
            return match ? match[1] : '';
        }

        // จัดการเมื่อเลือกไฟล์ Excel
        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                workbookData = {};
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    // แปลง Sheet เป็น JSON array
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    
                    if (rows.length > 0) {
                        const parsedRows = [];
                        // ข้าม Header แถวแรก
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (row && (row[0] || row[1])) {
                                parsedRows.push({
                                    code: row[0] ? String(row[0]).trim() : '-',
                                    desc: row[1] ? String(row[1]).trim() : '-'
                                });
                            }
                        }
                        if (parsedRows.length > 0) {
                            workbookData[sheetName] = parsedRows;
                        }
                    }
                });

                // บันทึกลง LocalStorage ให้ไม่ต้องกดอัปโหลดใหม่ทุกรอบ
                try {
                    localStorage.setItem('cachedMaintenanceExcel', JSON.stringify(workbookData));
                } catch(e) {
                    console.log('Cache storage full');
                }

                buildMenu();
            };
            reader.readAsArrayBuffer(file);
        });

        // สร้างเมนูด้านซ้ายจาก Sheet Names
        function buildMenu() {
            const sheetNames = Object.keys(workbookData);
            const menuEl = document.getElementById('sidebarMenu');
            menuEl.innerHTML = '<div class="menu-category">Sheet ข้อมูล</div>';

            if (sheetNames.length === 0) return;

            sheetNames.forEach((name, index) => {
                const count = workbookData[name].length;
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="javascript:void(0)" class="${index === 0 ? 'active' : ''}" onclick="selectSheet('${name}')">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>${name}</span>
                        <span class="badge-count">${count}</span>
                    </a>
                `;
                menuEl.appendChild(li);
            });

            // เลือกแท็บแรกอัตโนมัติ
            selectSheet(sheetNames[0]);
        }

        // สลับเลือก Sheet
        function selectSheet(sheetName) {
            activeSheet = sheetName;
            currentFilter = 'ALL';
            searchQuery = '';
            document.getElementById('searchInput').value = '';

            // Update UI Menu
            const links = document.querySelectorAll('#sidebarMenu li a');
            links.forEach(a => {
                const span = a.querySelector('span');
                if (span && span.innerText === sheetName) {
                    a.classList.add('active');
                } else {
                    a.classList.remove('active');
                }
            });

            // Update Title
            document.getElementById('pageTitle').innerHTML = `<i class="fa-solid fa-layer-group" style="margin-right: 10px; color: var(--accent-color);"></i>${sheetName}`;

            // Reset Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes('ทั้งหมด'));
            });

            updateStats();
            renderTable();
        }

        function updateStats() {
            const data = workbookData[activeSheet] || [];
            let countT = 0, countL = 0, countH = 0;

            data.forEach(item => {
                const code = extractDeviceCode(item.desc);
                const prefix = code ? code.charAt(0) : '';
                if (prefix === 'T') countT++;
                else if (prefix === 'L') countL++;
                else if (prefix === 'H') countH++;
            });

            document.getElementById('totalRecords').innerText = data.length;
            document.getElementById('totalT').innerText = countT;
            document.getElementById('totalL').innerText = countL;
            document.getElementById('totalH').innerText = countH;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const data = workbookData[activeSheet] || [];

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">ไม่พบข้อมูลใน Sheet นี้</td></tr>`;
                return;
            }

            const filtered = data.filter(item => {
                const devCode = extractDeviceCode(item.desc);
                const prefix = devCode ? devCode.charAt(0) : '';

                const matchesCategory = (currentFilter === 'ALL') || 
                                      (currentFilter === 'T' && prefix === 'T') ||
                                      (currentFilter === 'L' && prefix === 'L') ||
                                      (currentFilter === 'H' && (prefix === 'H' || prefix === ''));

                const matchesSearch = item.code.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.desc.toLowerCase().includes(searchQuery.toLowerCase());

                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">ไม่พบข้อมูลที่ตรงกับคำค้นหา</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                const devCode = extractDeviceCode(item.desc);
                const descText = devCode ? item.desc.replace(devCode, '').trim() : item.desc;
                const prefix = devCode ? devCode.charAt(0) : '';

                let tagHtml = '';
                if (devCode) {
                    let tagClass = 'tag-h';
                    if (prefix === 'T') tagClass = 'tag-t';
                    else if (prefix === 'L') tagClass = 'tag-l';
                    tagHtml = `<span class="tag ${tagClass}">${devCode}</span>`;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">${index + 1}</td>
                    <td class="failure-text">${item.code}</td>
                    <td>
                        ${tagHtml}
                        <span class="desc-text">${descText}</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterData(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(category === 'ALL' ? 'ทั้งหมด' : category)) {
                    btn.classList.add('active');
                }
            });
            renderTable();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTable();
        });

        // โหลดข้อมูลเดิมที่เคยบันทึกไว้ในเบราว์เซอร์อัตโนมัติ (ถ้ามี)
        window.addEventListener('DOMContentLoaded', () => {
            const cached = localStorage.getItem('cachedMaintenanceExcel');
            if (cached) {
                try {
                    workbookData = JSON.parse(cached);
                    buildMenu();
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
